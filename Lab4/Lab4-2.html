<!-- 2 Create login and registration  page where if user click on login page then open login page and if user click on registration page then open registration page. -->
 
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>
<body>

    <h2>Login Form</h2>

    <form action="" method="post">
        <p>
            <label>Email Address:</label><br>
            <input type="email" name="email" required>
        </p>
        
        <p>
            <label>Password:</label><br>
            <input type="password" name="password" required>
        </p>

        <p>
            <input type="checkbox" id="remember">
            <label for="remember">Remember me</label>
        </p>

        <p>
            <input type="submit" value="Log In">
        </p>
    </form>

    <hr>

    <p>Don't have an account?</p>
    <a href="register.html">Click here to Go to Registration Page</a>

</body>
</html>
