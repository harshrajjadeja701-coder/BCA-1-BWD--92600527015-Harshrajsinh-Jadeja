<!-- 8. Create unordered list of menu of restaurant. -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu Restaurant</title>
    </head>
    <body>
        <div class="container">
            <table width="200px" height="100px" border="1">
                <tr>
                    <th colspan="2">Menu Items</th>
                </tr>
                <tr>
                    <td>
                        <ul>
                            <li>Pizza</li>
                            <li>Pasta</li>
                            <li>Burger</li>                                  
                            <li>French Fries</li>
                            <li>Cold Drink</li>
                            <li>Dips</li>
                        </ul>
                    </td>
                    <td>
                        <ul>
                            <li>$10</li>
                            <li>$5</li>
                            <li>$3</li>
                            <li>$2</li>
                            <li>$2</li>
                            <li>$1</li>
                        </ul>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
