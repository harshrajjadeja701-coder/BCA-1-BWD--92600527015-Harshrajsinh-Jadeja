<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 8 - Simple Web Page</title>
  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

     p {
      background-color: #fafafa;
      padding: 15px;
      text-align: center;
    }

     a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.3s;
    }

    a {
      color: #1246f3;
    }

     img {
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }

     h1 {
      color: #000000;
      font-size: 22px;
      margin-top: 15px;
    }

     p {
      color: #080808;
      font-size: 15px;
      line-height: 1.5;
    }

     a {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

     a {
      background-color: #24648f;
    }
  </style>
</head>
<body>


    <a href="https://www.google.com" target="_blank">Google</a>

  </div>
